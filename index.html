<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo search</title>
  <style>
    body {
      margin: 0;
      background: #f7f6f3;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      background: #2f5d50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .demo-links {
      font-size: 14px;
      color: #666;
      margin: 12px 0 28px;
    }

    .demo-links a {
      color: #2f5d50;
    }

    .loading,
    .error,
    .empty {
      padding: 16px;
      border-radius: 4px;
    }

    .loading {
      background: #eaf1f8;
      border: 1px solid #b9cde0;
      color: #2b4a6b;
    }

    .error {
      background: #fdeeee;
      border: 1px solid #e3aaa5;
      color: #8a2a1f;
    }

    .error button {
      margin-top: 10px;
      background: #8a2a1f;
    }

    .empty {
      background: white;
      border: 1px dashed #aaa;
      color: #555;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid #b9cde0;
      border-top-color: #2b4a6b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .repo {
      padding: 14px 0;
      border-bottom: 1px solid #ddd;
    }

    .repo h2 {
      font-size: 17px;
      margin: 0;
    }

    .repo a {
      color: #2f5d50;
    }

    .repo p {
      margin: 4px 0;
      color: #555;
    }

    .repo small {
      color: #777;
    }
  </style>
</head>
<body>
  <main>
    <h1>Search repositories</h1>

    <form id="search-form">
      <input id="search-input" type="search" placeholder="Search public repositories" aria-label="Search public repositories">
      <button type="submit">Search</button>
    </form>

    <!-- links for the reviewer, see README -->
    <p class="demo-links">
      Try a state:
      <a href="?demo=loading">loading</a>,
      <a href="?demo=error">error</a>,
      <a href="?q=stars%3A%3E10000000">empty</a>
    </p>

    <div id="results" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const results = document.getElementById("results");

    // used for the demo links (?demo=loading etc)
    const params = new URLSearchParams(window.location.search);
    let pendingDemo = params.get("demo");

    function showLoading() {
      results.innerHTML = '<div class="loading"><span class="spinner"></span>Searching repositories...</div>';
    }

    function showError(message) {
      results.innerHTML = `
        <div class="error">
          <strong>Request failed.</strong>
          <p id="error-message"></p>
          <button id="retry-btn">Try again</button>
        </div>
      `;
      document.getElementById("error-message").textContent = message;
      document.getElementById("retry-btn").addEventListener("click", function () {
        search(input.value);
      });
    }

    function showEmpty(query) {
      // this is not an error, the search worked and found nothing
      results.innerHTML = `
        <div class="empty">
          <strong>No repositories found.</strong>
          <p>Your search for "<span id="empty-query"></span>" succeeded, but found no repositories. Check your spelling or try more general terms.</p>
        </div>
      `;
      // textContent so weird characters in the query can't break the page
      document.getElementById("empty-query").textContent = query;
    }

    function showResults(repos) {
      results.innerHTML = "";

      for (const repo of repos) {
        const card = document.createElement("div");
        card.className = "repo";

        const title = document.createElement("h2");
        const link = document.createElement("a");
        link.href = repo.html_url;
        link.textContent = repo.full_name;
        title.appendChild(link);

        const desc = document.createElement("p");
        desc.textContent = repo.description || "No description.";

        const info = document.createElement("small");
        info.textContent = repo.stargazers_count + " stars";
        if (repo.language) {
          info.textContent += ", " + repo.language;
        }

        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(info);
        results.appendChild(card);
      }
    }

    async function search(query) {
      query = query.trim();
      if (query === "") {
        return;
      }

      showLoading();

      // demo modes so the reviewer doesn't have to edit anything
      const demo = pendingDemo;
      pendingDemo = null;
      if (demo === "loading") {
        return; // just stay on the loading screen
      }
      if (demo === "error") {
        showError("This is the demo error. Remove ?demo=error from the URL and search again.");
        return;
      }

      try {
        const url = "https://api.github.com/search/repositories?per_page=10&q=" + encodeURIComponent(query);
        const response = await fetch(url);

        // github limits searches if you do a lot of them without logging in
        if (response.status === 403 || response.status === 429) {
          showError("GitHub's rate limit was hit. Wait a minute and try again.");
          return;
        }

        if (!response.ok) {
          const statusText = response.statusText ? " (" + response.statusText + ")" : "";
          showError("The request returned HTTP " + response.status + statusText + ". Check the address and try again.");
          return;
        }

        const data = await response.json();

        if (data.items.length === 0) {
          showEmpty(query);
        } else {
          showResults(data.items);
        }
      } catch (err) {
        // fetch only throws if the request never got through (offline etc)
        showError("Couldn't reach GitHub. Check your connection and try again.");
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      search(input.value);
    });

    // run on page load if the url has ?q= or ?demo=
    if (params.get("q")) {
      input.value = params.get("q");
      search(input.value);
    } else if (params.get("demo")) {
      input.value = "demo";
      search("demo");
    }
  </script>
</body>
</html>
